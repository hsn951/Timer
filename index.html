<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>马卡龙计时器</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <div class="card" id="card">
        <!-- ===== 标准模式 ===== -->
        <div class="normal-view" id="normalView">
          <header class="topbar" data-tauri-drag-region>
            <div class="brand" data-tauri-drag-region>
              <span class="logo"></span>
              <span>马卡龙计时器</span>
            </div>
            <div class="win-actions">
              <button class="icon-btn" id="btnPin" title="窗口置顶">
                <svg viewBox="0 0 24 24"><path d="M9 4h6l-1 7 3 3H7l3-3-1-7z"/><path d="M12 17v3"/></svg>
              </button>
              <button class="icon-btn" id="btnMini" title="迷你模式">
                <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
              </button>
              <button class="icon-btn" id="btnSettings" title="设置">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
              </button>
              <button class="icon-btn" id="btnClose" title="关闭到托盘">
                <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
              </button>
            </div>
          </header>

          <nav class="tabs" id="tabs">
            <span class="tab-pill" id="tabPill"></span>
            <button data-kind="stopwatch">秒表</button>
            <button data-kind="countdown">倒计时</button>
            <button data-kind="pomodoro">番茄</button>
          </nav>

          <main class="stage">
            <div class="ring-wrap">
              <svg class="ring" viewBox="0 0 220 220">
                <defs>
                  <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#FFA3B8" />
                    <stop offset="55%" stop-color="#C6A6F8" />
                    <stop offset="100%" stop-color="#9FD3FF" />
                  </linearGradient>
                </defs>
                <circle class="ring-track" cx="110" cy="110" r="94" />
                <circle class="ring-progress" id="ringProgress" cx="110" cy="110" r="94" />
              </svg>
              <div class="readout">
                <div class="digits" id="digits">25:00</div>
                <div class="sub" id="subLabel">专注 · 25 分钟</div>
                <div class="phase-dots" id="phaseDots"></div>
              </div>
            </div>
            <div class="laps" id="laps"></div>
          </main>

          <section class="presets" id="presetsSection">
            <div class="presets-head">
              <span>我的计时器</span>
              <button id="btnAddPreset">＋ 新建</button>
            </div>
            <div class="preset-list" id="presetList"></div>
          </section>

          <footer class="controls">
            <button id="btnReset" class="btn ghost">重置</button>
            <button id="btnPrimary" class="btn primary">开始</button>
            <button id="btnSecondary" class="btn ghost">计次</button>
          </footer>
        </div>

        <!-- ===== 迷你模式 ===== -->
        <div class="mini-view" id="miniView" data-tauri-drag-region hidden>
          <div class="mini-readout" data-tauri-drag-region>
            <div class="mini-digits" id="miniDigits">25:00</div>
            <div class="mini-sub" id="miniSub">倒计时</div>
          </div>
          <div class="mini-actions">
            <button class="mini-btn" id="miniToggle" title="开始/暂停">
              <svg viewBox="0 0 24 24" id="miniToggleIcon"><path d="M8 5l11 7-11 7V5z"/></svg>
            </button>
            <button class="mini-btn" id="miniExpand" title="展开">
              <svg viewBox="0 0 24 24"><path d="M9 4H4v5M15 20h5v-5M20 9V4h-5M4 15v5h5"/></svg>
            </button>
          </div>
        </div>

        <!-- ===== 设置抽屉 ===== -->
        <section class="drawer" id="settingsDrawer" hidden>
          <header class="drawer-head">
            <button class="icon-btn" id="btnBack" title="返回">
              <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <span>设置</span>
            <span class="version" id="versionText">v0.1.0</span>
          </header>

          <div class="drawer-body">
            <div class="group">
              <div class="group-title">主题色</div>
              <div class="accent-row" id="accentRow"></div>
            </div>

            <div class="group">
              <div class="group-title">结束铃声</div>
              <div class="sound-list" id="soundList"></div>
              <button class="link-btn" id="btnImportSound">＋ 导入本地音频（wav / mp3 / ogg / flac）</button>

              <div class="row">
                <span>音量</span>
                <div class="row-right">
                  <input type="range" id="setVolume" min="0" max="100" value="70" />
                  <span class="mono" id="volLabel">70%</span>
                </div>
              </div>
              <div class="row">
                <span>渐强</span>
                <label class="switch"><input type="checkbox" id="setFade" /><i></i></label>
              </div>
            </div>

            <div class="group">
              <div class="group-title">窗口</div>
              <div class="row">
                <span>窗口置顶</span>
                <label class="switch"><input type="checkbox" id="setPin" /><i></i></label>
              </div>
              <div class="row">
                <span>开机自启</span>
                <label class="switch"><input type="checkbox" id="setAutostart" /><i></i></label>
              </div>
              <div class="hint">关闭窗口会收进系统托盘，计时继续运行。</div>
            </div>

            <div class="group">
              <div class="group-title">番茄钟</div>
              <div class="grid-3">
                <label class="field"><span>专注</span><input type="number" id="setWork" min="1" max="180" /></label>
                <label class="field"><span>休息</span><input type="number" id="setBreak" min="1" max="60" /></label>
                <label class="field"><span>长休息</span><input type="number" id="setLongBreak" min="1" max="120" /></label>
              </div>
              <div class="grid-3">
                <label class="field"><span>轮数</span><input type="number" id="setRounds" min="2" max="12" /></label>
                <div class="field switch-field"><span>自动继续</span><label class="switch"><input type="checkbox" id="setAuto" /><i></i></label></div>
              </div>
            </div>
          </div>
        </section>

        <!-- ===== 新建计时器 ===== -->
        <section class="sheet" id="presetSheet" hidden>
          <header class="sheet-head">
            <span>新建计时器</span>
            <button class="icon-btn" id="btnSheetClose">
              <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </header>
          <div class="sheet-preview" id="presetPreview">03:00</div>
          <label class="field"><span>名称</span><input id="presetName" maxlength="12" placeholder="例如：泡面" /></label>
          <div class="grid-3">
            <label class="field"><span>分</span><input type="number" id="presetMin" min="0" max="999" value="3" /></label>
            <label class="field"><span>秒</span><input type="number" id="presetSec" min="0" max="59" value="0" /></label>
            <div class="field"><span>颜色</span><div class="color-row" id="presetColors"></div></div>
          </div>
          <div class="quick-row" id="presetQuick"></div>
          <p class="sheet-hint">保存后会立即开始，之后可在「我的计时器」里一键重复使用。</p>
          <button class="btn primary" id="btnSavePreset">保存并开始</button>
        </section>

        <div class="toast" id="toast" hidden></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
